[project]
name = "sentinel"
version = "1.1.0"
description = "Sentinel — watchers that page you (calendar conflicts, urgent mail, GitHub, Slack, anything) + one morning brief + reply-to-act agent for Claude Code"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "google-auth>=2.29",
  "google-auth-oauthlib>=1.2",
  "msal>=1.28",
  "python-dateutil>=2.9",
  "tzdata",
  "icalendar>=7.2.2",
  "recurring-ical-events>=3.8.2",
]

[project.scripts]
calwatch = "calwatch.cli:main"
mailwatch = "mailwatch.cli:main"
ghwatch = "ghwatch.cli:main"
slackwatch = "slackwatch.cli:main"
sentinel = "sentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calwatch", "mailwatch", "ghwatch", "slackwatch", "sentinel"]
